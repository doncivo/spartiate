# Build iPhone sans Mac (PRD section 7, ADR 0007).
# Déclenchement manuel ou sur tag ios-v* uniquement : les minutes macOS d'un dépôt privé coûtent 10 fois plus.
# Lancement sur une branche de lot (I-01) : gh workflow run build-ios.yml --ref <branche> -f publish=false.
# Publication seulement sur un tag ios-v* (push du tag, ou lancement manuel sur ce tag avec publish),
# avec l'environnement releases (sans approbation manuelle, décision d'Ali du 2026-10-07) ; jamais depuis une branche, même avec publish coché.
# L'IPA est compilée sans signature (--no-sign), puis signée AD HOC en CI avec les entitlements HealthKit versionnés (SPA-003, D-14) ;
# SideStore la re-signe sur l'iPhone avec l'Apple ID gratuit. La signature ad hoc ne prouve ni installation ni autorisation Santé (D-59).
# Le tag iOS (ios-vX.Y.Z) est distinct du tag PC (vX.Y.Z) qui déclenche build-windows.yml.
name: Build iOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier l'IPA et source.json sur spartiate-releases (sur un tag ios-v* seulement ; environnement releases + secret RELEASES_TOKEN)"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI-PUB (C-172) : sur un tag, rien n'est compilé ni signé tant que le check « suite verte » n'est pas vert sur le SHA du tag
  # (lecture seule par GITHUB_TOKEN, aucun autre secret). Lancement manuel sur une branche : le job réussit sans contrôle.
  garde:
    name: Suite verte du SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Contrôler le check « suite verte » du SHA du tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=suite%20verte&per_page=100" --jq '.check_runs' > check-runs.json
          node scripts/release/check-suite-verte.mjs check-runs.json "${GITHUB_SHA}"

      - name: Lancement manuel hors tag
        if: github.ref_type != 'tag'
        run: echo "::notice::Hors tag : aucun contrôle de la suite verte (rien n'est publié)."

  ios:
    needs: garde
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Sur tag, la version de tauri.conf.json doit correspondre au tag (ios-vX.Y.Z).
      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "ios-v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${VERSION} de tauri.conf.json"
            exit 1
          fi

      # I-06 (ADR 0007 avenant I-06 point 3) : notes de version tirées de CHANGELOG.md (script commun avec build-windows.yml), calculées
      # AVANT la compilation. Tag ios-v* : section absente = échec ; branche : avertissement visible et repli « Spartiate X.Y.Z ».
      - name: Notes de version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p notes
          if ! node scripts/release/release-notes.mjs "$VERSION" > notes/notes.txt; then
            case "${GITHUB_REF}" in
              refs/tags/ios-v*) echo "::error::Aucune section « ## ${VERSION} » dans CHANGELOG.md : publication refusée"; exit 1;;
            esac
            echo "::warning::Aucune section « ## ${VERSION} » dans CHANGELOG.md : notes de repli « Spartiate ${VERSION} »"
            echo "Spartiate ${VERSION}" > notes/notes.txt
          fi

      - name: Rust stable et cible iOS
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branche stable au 2026-10-07)
        with:
          targets: aarch64-apple-ios

      # Le cache n'est lisible que par ce dépôt. Exclure les binaires finaux casserait la compilation incrémentale.
      # CI-PUB (C-175) : hors tag, lecture et écriture ; sur tag (build publié), lecture seule sur clé exacte, jamais réécrit (comme build-windows.yml).
      - name: Cache cargo
        if: github.ref_type != 'tag'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Cache cargo (lecture seule)
        if: github.ref_type == 'tag'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # ADR 0011 §22 point 10 (Y-IOS-01) : le plugin folder-bookmark est dans la cible iOS et nulle part ailleurs ; aucun plugin PC dans la
      # cible iOS (ADR 0007). Résolution seulement (aucune compilation) : la cible Windows se résout aussi sur ce runner.
      - name: Dépendances des cibles iOS et Windows
        working-directory: src-tauri
        run: |
          set -euo pipefail
          ios=$(cargo tree --locked --target aarch64-apple-ios -e normal --prefix none)
          grep -q '^tauri-plugin-folder-bookmark ' <<<"$ios" || { echo "::error::tauri-plugin-folder-bookmark absent de la cible iOS"; exit 1; }
          for pc in tauri-plugin-single-instance tauri-plugin-autostart tauri-plugin-updater tauri-plugin-process tauri-plugin-opener tauri-plugin-dialog tauri-plugin-fs tauri-plugin-global-shortcut; do
            if grep -q "^$pc " <<<"$ios"; then echo "::error::plugin PC dans la cible iOS : $pc"; exit 1; fi
          done
          windows=$(cargo tree --locked --target x86_64-pc-windows-msvc -e normal --prefix none)
          if grep -q '^tauri-plugin-folder-bookmark ' <<<"$windows"; then echo "::error::tauri-plugin-folder-bookmark dans la cible Windows"; exit 1; fi
          # ADR 0011 §23 point 1 (Y-IOS-02) : Trousseau par security-framework 3.7.0 (celle de keyring), utilisé directement par l'app.
          sf=$(cargo tree --locked --target aarch64-apple-ios -e normal -i security-framework@3.7.0 --prefix none)
          grep -q '^spartiate ' <<<"$sf" || { echo "::error::security-framework 3.7.0 n'est pas une dépendance directe de l'app iOS"; exit 1; }
          grep -q '^tauri-plugin-barcode-scanner ' <<<"$ios" || { echo "::error::tauri-plugin-barcode-scanner absent de la cible iOS"; exit 1; }
          # I6-06 (D-222) : GPS au premier plan, plugin officiel geolocation, iPhone seulement.
          grep -q '^tauri-plugin-geolocation ' <<<"$ios" || { echo "::error::tauri-plugin-geolocation absent de la cible iOS"; exit 1; }
          if grep -q '^tauri-plugin-geolocation ' <<<"$windows"; then echo "::error::tauri-plugin-geolocation dans la cible Windows"; exit 1; fi

      # Le projet Xcode (src-tauri/gen/apple) n'est pas versionné : il est régénéré à chaque build
      # depuis tauri.conf.json et src-tauri/Info.ios.plist.
      - name: Initialiser le projet iOS
        run: npx tauri ios init --ci

      # 0.1.4 (8) : `tauri ios init` ne recopie pas src-tauri/icons/ios : sans cette étape l'iPhone affiche l'icône Tauri par défaut. Chaque
      # icône listée par l'AppIcon généré est copiée ; échec si une taille manque, a de mauvaises dimensions ou si la copie diffère.
      - name: Icônes de l'app
        run: node scripts/ios/apply-icons.mjs

      # SPA-003 : la source durable (src-tauri/ios/Spartiate.entitlements) est copiée dans la sortie générée ; échec si source, dossier
      # ou égalité octet à octet font défaut. La copie générée n'est jamais la source de vérité.
      - name: Entitlements durables
        run: node scripts/ios/apply-entitlements.mjs

      # SPA-007 (H-4) : une seule cible d'extension SpartiateLiveActivity (WidgetKit) est ajoutée à project.yml (idempotent), embarquée dans
      # l'app, puis le projet est régénéré par XcodeGen et contrôlé. Ni App Group, ni push, ni mode de fond, ni entitlement pour l'extension.
      - name: Extension Live Activity
        run: node scripts/ios/inject-live-activity.mjs

      # Plugins iOS (N-01, ADR 0012 avenant N1.9) : le plugin de notifications locales est compilé pour l'iPhone et JAMAIS pour le PC
      # (le PC n'envoie aucune notification de rappel). Échec explicite dans les deux sens.
      - name: Plugins iOS
        run: |
          set -euo pipefail
          cd src-tauri
          # CI-PUB (C-174) : l'arbre des dépendances normales de chaque cible est calculé UNE fois ; si cargo tree échoue, l'étape échoue
          # (plus de « || true » qui laissait passer un contrôle d'absence). Présence et absence se lisent ensuite dans ces deux listes.
          IOS_TREE=$(cargo tree --locked --target aarch64-apple-ios -e normal --prefix none)
          WIN_TREE=$(cargo tree --locked --target x86_64-pc-windows-msvc -e normal --prefix none)
          in_ios() { grep -q "^$1 v" <<<"$IOS_TREE"; }
          in_win() { grep -q "^$1 v" <<<"$WIN_TREE"; }
          # N-01 (ADR 0012 avenant N1.9) : le plugin de notifications locales est compilé pour l'iPhone et JAMAIS pour le PC
          # (le PC n'envoie aucune notification de rappel). Échec explicite dans les deux sens.
          # N-03 (ADR 0012 avenant N-03) : plugin Swift des actions de notification, iPhone seulement.
          # Lot M (ADR 0013 §5) : Face ID (I-03, officiel épinglé), retour haptique (A-07), cache de confidentialité (I-03) ; CAP-IOS-01
          # (ADR 0015 §4.4) : vision et speech, appelés par Rust seul. Lot F (FILES-IOS-01 critère 10, ADR 0009 avenant lot F A1) : ct-files.
          for CRATE in tauri-plugin-notification tauri-plugin-notification-actions tauri-plugin-biometric tauri-plugin-ct-haptics tauri-plugin-privacy-shield tauri-plugin-vision tauri-plugin-speech tauri-plugin-ct-files; do
            in_ios "$CRATE" || { echo "::error::$CRATE absent de la compilation iOS"; exit 1; }
            if in_win "$CRATE"; then echo "::error::$CRATE présent dans la compilation Windows"; exit 1; fi
            echo "$CRATE : iOS oui, Windows non"
          done

      # Option officielle du CLI Tauri `--no-sign` (crates/tauri-cli/src/mobile/ios/build.rs, v2.12.1) :
      # `xcodebuild archive` avec CODE_SIGNING_ALLOWED=NO pendant que le CLI sert ses options à la phase
      # Xcode « Build Rust Code » (tauri ios xcode-script), puis Products/Applications/Spartiate.app est
      # zippé en Payload/ dans gen/apple/build/arm64/Spartiate.ipa. beforeBuildCommand (npm run build)
      # compile le front, embarqué dans le binaire Rust. Pourquoi ce choix : ADR 0007, avenant POC-01.
      - name: Compiler l'IPA sans signature
        run: npx tauri ios build --ci --no-sign --target aarch64

      - name: Copier l'IPA non signée
        run: |
          set -euo pipefail
          SRC=src-tauri/gen/apple/build/arm64/Spartiate.ipa
          test -f "$SRC" || { echo "::error::IPA absente : $SRC"; find src-tauri/gen/apple/build -maxdepth 3 || true; exit 1; }
          rm -rf "$RUNNER_TEMP/unsigned" && mkdir -p "$RUNNER_TEMP/unsigned"
          cp "$SRC" "$RUNNER_TEMP/unsigned/Spartiate.ipa"

      # SPA-003 (D-14) : signature ad hoc de l'app avec les entitlements copiés, puis IPA reconstruite. ipa/Spartiate.ipa est désormais
      # la SEULE IPA qui alimente les contrôles, le hash, les artefacts et la publication ; l'IPA non signée n'est plus jamais lue.
      - name: Signer ad hoc et reconstruire l'IPA
        run: |
          set -euo pipefail
          UNSIGNED="$RUNNER_TEMP/unsigned/Spartiate.ipa"
          WORK="$RUNNER_TEMP/sign"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$UNSIGNED" -d "$WORK"
          test -d "$WORK/Payload/Spartiate.app" || { echo "::error::Payload/Spartiate.app absent de l'IPA non signée"; find "$WORK" -maxdepth 3; exit 1; }
          test -f src-tauri/gen/apple/Spartiate.entitlements || { echo "::error::entitlements générés absents"; exit 1; }
          # SPA-007 : l'extension d'abord (signature ad hoc, SANS entitlements : ni App Group, ni push), puis l'app avec ses entitlements actuels.
          test -d "$WORK/Payload/Spartiate.app/PlugIns/SpartiateLiveActivity.appex" || { echo "::error::PlugIns/SpartiateLiveActivity.appex absent de l'IPA non signée"; find "$WORK/Payload/Spartiate.app" -maxdepth 2; exit 1; }
          codesign -s - --force "$WORK/Payload/Spartiate.app/PlugIns/SpartiateLiveActivity.appex"
          codesign -s - --entitlements src-tauri/gen/apple/Spartiate.entitlements --force "$WORK/Payload/Spartiate.app"
          rm -rf ipa && mkdir -p ipa
          (cd "$WORK" && zip -qry "$GITHUB_WORKSPACE/ipa/Spartiate.ipa" Payload)
          test -s ipa/Spartiate.ipa || { echo "::error::IPA finale vide"; exit 1; }

      - name: Vérifier l'IPA finale
        run: |
          set -euo pipefail
          ls -l ipa/Spartiate.ipa
          CHECK="$RUNNER_TEMP/check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          unzip -q ipa/Spartiate.ipa -d "$CHECK"
          APP="$CHECK/Payload/Spartiate.app"
          test -d "$APP" || { echo "::error::Payload/Spartiate.app absent"; find "$CHECK" -maxdepth 3; exit 1; }
          # SPA-003 : signature de l'app EXTRAITE de l'IPA finale (pas de l'app avant reconstruction).
          codesign --verify --strict --verbose=2 "$APP"
          PB=/usr/libexec/PlistBuddy
          ID=$($PB -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          MIN=$($PB -c "Print :MinimumOSVersion" "$APP/Info.plist")
          EXE=$($PB -c "Print :CFBundleExecutable" "$APP/Info.plist")
          VER=$($PB -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "Bundle ${ID}, version ${VER}, iOS minimum ${MIN}, exécutable ${EXE}"
          [ "$ID" = "fr.spartiate.app" ] || { echo "::error::Bundle id inattendu : $ID"; exit 1; }
          case "$MIN" in 18|18.0) ;; *) echo "::error::MinimumOSVersion inattendu : $MIN"; exit 1;; esac
          ARCHS=$(lipo -archs "$APP/$EXE")
          echo "Architectures : $ARCHS"
          echo "$ARCHS" | grep -qw arm64 || { echo "::error::binaire arm64 absent"; exit 1; }
          # Le front est embarqué (compressé) dans le binaire ; ses chemins d'assets y figurent en clair.
          ASSET=$(cd dist && ls assets/*.js | head -n 1)
          grep -q "/index.html" "$APP/$EXE" || { echo "::error::index.html non embarqué"; exit 1; }
          grep -q "/${ASSET}" "$APP/$EXE" || { echo "::error::${ASSET} non embarqué"; exit 1; }
          echo "Front embarqué : /index.html et /${ASSET} présents"
          du -sh "$APP" "$APP/$EXE"
          ls "$APP"

      # 0.1.4 (8) : l'IPA finale porte bien une icône d'app. La copie source -> AppIcon.appiconset est déjà contrôlée octet pour octet
      # (apply-icons.mjs, étape « Icônes de l'app ») ; ici : AppIcon60x60@2x.png et Assets.car présents, Info.plist déclarant CFBundleIcons
      # avec AppIcon. Les octets compilés ne se comparent pas à ceux d'une compilation lancée à part (options différentes). L'icône est gardée en
      # artefact pour un contrôle visuel.
      - name: Icône de l'IPA finale
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/check/Payload/Spartiate.app"
          test -s "$APP/AppIcon60x60@2x.png" || { echo "::error::AppIcon60x60@2x.png absent de l'IPA"; ls "$APP"; exit 1; }
          test -s "$APP/Assets.car" || { echo "::error::Assets.car absent de l'IPA"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" | grep -q AppIcon || { echo "::error::Info.plist sans CFBundleIcons / AppIcon"; exit 1; }
          mkdir -p icon && cp "$APP/AppIcon60x60@2x.png" icon/AppIcon60x60@2x.png
          echo "- Icône de l'IPA finale : AppIcon60x60@2x.png, Assets.car et CFBundleIcons/AppIcon présents (copie source contrôlée au hash avant le build)" >> "$GITHUB_STEP_SUMMARY"

      # SPA-007 (H-4) : l'extension est dans l'IPA finale, les DEUX signatures sont vérifiées en mode strict sur les octets de cette IPA, et le plist de
      # l'extension est relu (point d'extension WidgetKit, identifiant de l'app + .LiveActivity, aucun App Group, push ni mode de fond).
      - name: Extension Live Activity de l'IPA finale
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/check/Payload/Spartiate.app"
          test -d "$APP/PlugIns/SpartiateLiveActivity.appex" || { echo "::error::PlugIns/SpartiateLiveActivity.appex absent de l'IPA finale"; ls "$APP"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP/PlugIns/SpartiateLiveActivity.appex"
          codesign --verify --strict --verbose=2 "$APP"
          EXT="$APP/PlugIns/SpartiateLiveActivity.appex"
          PB=/usr/libexec/PlistBuddy
          POINT=$($PB -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT/Info.plist")
          EXTID=$($PB -c "Print :CFBundleIdentifier" "$EXT/Info.plist")
          EXTVER=$($PB -c "Print :CFBundleShortVersionString" "$EXT/Info.plist")
          [ "$POINT" = "com.apple.widgetkit-extension" ] || { echo "::error::point d'extension inattendu : $POINT"; exit 1; }
          [ "$EXTID" = "fr.spartiate.app.LiveActivity" ] || { echo "::error::identifiant de l'extension inattendu : $EXTID"; exit 1; }
          # L'extension doit porter les MÊMES versions que l'app (sinon l'installation est refusée : CFBundleVersion différent).
          APPVER=$($PB -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          APPBUILD=$($PB -c "Print :CFBundleVersion" "$APP/Info.plist")
          EXTBUILD=$($PB -c "Print :CFBundleVersion" "$EXT/Info.plist")
          [ "$APPVER" = "$EXTVER" ] || { echo "::error::version courte différente : app $APPVER, extension $EXTVER"; exit 1; }
          [ "$APPBUILD" = "$EXTBUILD" ] || { echo "::error::CFBundleVersion différent : app $APPBUILD, extension $EXTBUILD"; exit 1; }
          plutil -convert xml1 -o "$RUNNER_TEMP/extension-info.plist" "$EXT/Info.plist"
          if grep -Eq 'UIBackgroundModes|application-groups|aps-environment' "$RUNNER_TEMP/extension-info.plist"; then echo "::error::l'extension déclare un mode de fond, un App Group ou un push"; exit 1; fi
          codesign -d --entitlements :- "$EXT" > "$RUNNER_TEMP/extension-entitlements.plist" 2> "$RUNNER_TEMP/extension-entitlements.err"
          if grep -Eq 'application-groups|aps-environment|com.apple.developer.healthkit' "$RUNNER_TEMP/extension-entitlements.plist"; then echo "::error::l'extension porte un entitlement interdit"; exit 1; fi
          {
            echo "- Extension Live Activity de l'IPA finale : PlugIns/SpartiateLiveActivity.appex présente, ${EXTID} v${EXTVER}, point d'extension ${POINT}"
            echo "- Signatures (codesign --verify --strict) : app et extension vérifiées sur l'IPA finale ; extension sans entitlements, sans App Group, push ni mode de fond"
          } >> "$GITHUB_STEP_SUMMARY"

      # Contrat des permissions (I-01) : chaque plugin déclare ses clés dans scripts/ios/plist-contract.json.
      # Le Info.plist de l'IPA est binaire : converti en XML, gardé en artefact pour source.json (appPermissions).
      - name: Contrat des permissions Info.plist
        run: |
          set -euo pipefail
          rm -rf info && mkdir -p info
          plutil -convert xml1 -o info/Info.plist "$RUNNER_TEMP/check/Payload/Spartiate.app/Info.plist"
          node scripts/ios/check-plist-contract.mjs scripts/ios/plist-contract.json info/Info.plist
          PB=/usr/libexec/PlistBuddy
          USAGES=$( (grep -o '<key>NS[A-Za-z]*UsageDescription</key>' info/Info.plist || true) | sed 's/<[^>]*>//g' | tr '\n' ' ')
          {
            echo "### IPA Spartiate (${GITHUB_REF_NAME})"
            echo ""
            echo "- Taille : $(stat -f%z ipa/Spartiate.ipa) octets"
            echo "- SHA-256 : $(shasum -a 256 ipa/Spartiate.ipa | cut -d' ' -f1)"
            echo "- Version : $($PB -c 'Print :CFBundleShortVersionString' info/Info.plist) ($($PB -c 'Print :CFBundleVersion' info/Info.plist))"
            echo "- Descriptions d'usage : ${USAGES:-aucune}"
            # I-02 (ADR 0013 §3.1) : information seulement. Une IPA non signée n'a pas de profil ; SideStore écrit embedded.mobileprovision
            # (profil de 7 jours) à l'installation, et la commande app_signing_info le lit sur l'appareil (contrôle A1 de la fiche I-02).
            echo "- Signature : ad hoc (CI, SPA-003), vérifiée par codesign sur l'app extraite de cette IPA"
            if [ -f "$RUNNER_TEMP/check/Payload/Spartiate.app/embedded.mobileprovision" ]; then echo "- embedded.mobileprovision : présent dans l'IPA"; else echo "- embedded.mobileprovision : absent de l'IPA (normal en signature ad hoc ; SideStore l'écrit à l'installation, I-02)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # SPA-003, preuve H-3a : entitlements relus depuis l'app extraite de l'IPA finale (le fichier durable et la sortie avant re-zip ne prouvent rien).
      - name: Entitlements de l'IPA finale
        run: |
          set -euo pipefail
          mkdir -p info
          codesign -d --entitlements :- "$RUNNER_TEMP/check/Payload/Spartiate.app" > info/entitlements.plist
          node scripts/ios/apply-entitlements.mjs --check info/entitlements.plist
          echo "- Entitlements extraits de l'IPA finale : com.apple.developer.healthkit = true (H-3a ; ni permission ni lecture Santé, D-59)" >> "$GITHUB_STEP_SUMMARY"

      # I-06 (ADR 0007 avenant I-06 point 2, critère 5) : source SideStore SIMULÉE avec l'IPA de ce build et la source publiée (lue à l'URL
      # publique, aucun secret), contrôlée par check-source.mjs (build croissant, URL, sha256, taille, identifiant, champs hérités). Rien
      # n'est publié ici : la publication reste le job publish, sur un tag ios-v* seulement.
      - name: Source SideStore simulée
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NOTES=$(cat notes/notes.txt)
          rm -rf sim && mkdir -p sim
          if ! curl -fsSL "https://raw.githubusercontent.com/doncivo/spartiate-releases/main/source.json" -o sim/published.json; then
            echo "::warning::Source publiée illisible : simulation sans les versions déjà publiées"
            rm -f sim/published.json
          fi
          node scripts/ios/make-source-json.mjs --version "$VERSION" --ipa ipa/Spartiate.ipa --info-plist info/Info.plist \
            --url "https://github.com/doncivo/spartiate-releases/releases/download/ios-v${VERSION}/Spartiate.ipa" --notes "$NOTES" \
            --existing sim/published.json > sim/source.json
          # Hors tag ios-v* (branche de lot) : une version plus basse que la plus haute publiée n'est qu'un avertissement (revue I-06 M2).
          DOWNGRADE=error
          case "${GITHUB_REF}" in refs/tags/ios-v*) ;; *) DOWNGRADE=warn;; esac
          node scripts/ios/check-source.mjs sim/source.json --published "$VERSION" --downgrade "$DOWNGRADE"
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' info/Info.plist)
          COUNT=$(node -p "require('./sim/source.json').apps[0].versions.length")
          {
            echo "- Source SideStore simulée : version ${VERSION}, build ${BUILD}, ${COUNT} version(s) dans la source"
            echo "- Notes (première ligne) : $(head -n 1 notes/notes.txt)"
            echo "- source valide"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Spartiate-ipa
          path: ipa/Spartiate.ipa
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Spartiate-info-plist
          path: info/Info.plist
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Spartiate-app-icon
          path: icon/AppIcon60x60@2x.png
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Spartiate-entitlements
          path: info/entitlements.plist
          if-no-files-found: error
          retention-days: 30

      - name: Journaux de compilation en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-ios-logs
          path: |
            src-tauri/gen/apple/build/**/*.log
            src-tauri/gen/apple/project.yml
          if-no-files-found: ignore
          retention-days: 7

  # Publication : tag ios-v* seulement (push du tag, ou lancement manuel sur le tag avec publish).
  # Une branche n'est jamais publiée, même avec publish coché (I-01). L'environnement « releases »
  # porte RELEASES_TOKEN, sans approbation manuelle (décision d'Ali du 2026-10-07).
  publish:
    needs: ios
    if: startsWith(github.ref, 'refs/tags/ios-v') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Spartiate-ipa
          path: ipa

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Spartiate-info-plist
          path: info

      - name: Publier sur spartiate-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # Seconde barrière, indépendante de la condition du job : jamais de publication hors tag ios-v*.
          case "${GITHUB_REF}" in refs/tags/ios-v*) ;; *) echo "::error::Publication refusée hors tag ios-v* (${GITHUB_REF})"; exit 1;; esac
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret RELEASES_TOKEN absent : publication impossible (l'IPA reste en artefact)."
            exit 1
          fi
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="ios-v${VERSION}"
          if [ "${TAG}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${VERSION}"
            exit 1
          fi
          REPO="doncivo/spartiate-releases"
          IPA_URL="https://github.com/${REPO}/releases/download/${TAG}/Spartiate.ipa"
          # I-06 : notes de CHANGELOG.md (script commun) ; sur un tag, une section absente fait échouer la publication.
          NOTES=$(node scripts/release/release-notes.mjs "$VERSION") || { echo "::error::Aucune section « ## ${VERSION} » dans CHANGELOG.md : publication refusée"; exit 1; }
          # Le jeton passe par le credential helper de gh, jamais dans l'URL ni dans .git/config.
          gh auth setup-git
          git clone "https://github.com/${REPO}.git" releases
          node scripts/ios/make-source-json.mjs --version "$VERSION" --ipa ipa/Spartiate.ipa --info-plist info/Info.plist \
            --url "$IPA_URL" --notes "$NOTES" --existing releases/source.json > source.new.json
          # I-06 : contrôle de la source AVANT toute publication (release et push) ; un écart arrête tout.
          node scripts/ios/check-source.mjs source.new.json --published "$VERSION"
          if gh release create "$TAG" ipa/Spartiate.ipa --repo "$REPO" --title "Spartiate iPhone ${VERSION}" --notes "$NOTES" --latest=false; then
            echo "Release ${TAG} créée."
          else
            # CI-PUB (C-172) : republication. L'IPA déjà publiée est comparée (SHA-256) avant que --clobber ne la remplace ;
            # le remplacement reste permis (relance d'une publication interrompue) mais jamais sans trace dans le journal.
            NEW=$(sha256sum ipa/Spartiate.ipa | cut -d' ' -f1)
            mkdir -p existing
            if gh release download "$TAG" --repo "$REPO" --pattern Spartiate.ipa --dir existing; then
              OLD=$(sha256sum existing/Spartiate.ipa | cut -d' ' -f1)
              if [ "$OLD" = "$NEW" ]; then
                echo "IPA déjà publiée et identique (sha256 ${NEW})."
              else
                echo "::warning::--clobber remplace une IPA déjà publiée : sha256 ancien ${OLD}, nouveau ${NEW}."
              fi
            else
              echo "::warning::IPA publiée illisible : --clobber sans comparaison (sha256 nouveau ${NEW})."
            fi
            gh release upload "$TAG" ipa/Spartiate.ipa --repo "$REPO" --clobber
          fi
          cp source.new.json releases/source.json
          # iconURL est obligatoire pour SideStore (StoreApp.swift) : icône servie par le dépôt public.
          cp src-tauri/icons/icon.png releases/icon.png
          cd releases
          git config user.name "spartiate-ci"
          git config user.email "ci@users.noreply.github.com"
          git add source.json icon.png
          git commit -m "source.json: iPhone ${VERSION}" || echo "Rien à valider"
          # Le dépôt public a pu bouger depuis le clone (publication PC) : rebase avant le push,
          # une seule nouvelle tentative si le push est refusé, sinon échec visible du job.
          git pull --rebase
          if ! git push; then
            echo "::warning::Push de source.json refusé, nouvelle tentative après rebase."
            if ! { git pull --rebase && git push; }; then
              echo "::error::Push de source.json impossible : l'IPA est publiée mais la source SideStore n'est pas à jour. Relancer la publication."
              exit 1
            fi
          fi
