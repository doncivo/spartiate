# Build et publication de l'app PC (PRD section 7, ADR 0006, story D-03 critères 10 et 11).
# Tag vX.Y.Z : build NSIS signé (clé updater), vérification de la signature, latest.json, publication sur spartiate-releases.
# Lancement manuel : build seul, installeur NON signé en artefact, jamais de publication.
# Le job publish ne tourne que sur un push de tag vX.Y.Z.
# Le tag iOS (ios-vX.Y.Z) est distinct et ne déclenche pas ce workflow.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  # Dépôt public des versions : déclaré une seule fois (doit rester aligné sur plugins.updater.endpoints).
  RELEASES_REPO: doncivo/spartiate-releases

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI-PUB (C-172) : sur un tag, rien n'est compilé ni signé tant que le check « suite verte » n'est pas vert sur le SHA du tag
  # (lecture seule par GITHUB_TOKEN, aucun autre secret). Lancement manuel sur une branche : le job réussit sans contrôle.
  garde:
    name: Suite verte du SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Contrôler le check « suite verte » du SHA du tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=suite%20verte&per_page=100" --jq '.check_runs' > check-runs.json
          node scripts/release/check-suite-verte.mjs check-runs.json "${GITHUB_SHA}"

      - name: Lancement manuel hors tag
        if: github.ref_type != 'tag'
        run: echo "::notice::Hors tag : aucun contrôle de la suite verte (rien n'est publié)."

  windows:
    needs: garde
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      sha256: ${{ steps.collect.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # La version du tag, de tauri.conf.json, de package.json et de Cargo.toml doit être identique.
      # Hors tag (lancement manuel), seule la cohérence des trois fichiers est vérifiée.
      - name: Vérifier les versions
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/release/check-version.mjs "${GITHUB_REF_NAME}"
            # I-06 (ADR 0007 avenant I-06 point 3) : un tag sans section dans CHANGELOG.md échoue AVANT la compilation.
            VERSION="${GITHUB_REF_NAME#v}"
            node scripts/release/release-notes.mjs "${VERSION}" > /dev/null || { echo "::error::Aucune section « ## ${VERSION} » dans CHANGELOG.md : publication refusée"; exit 1; }
          else
            node scripts/release/check-version.mjs
          fi

      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Le cache n'est lisible que par ce dépôt. Exclure les binaires finaux casserait la compilation incrémentale.
      # Hors tag : cache lecture/écriture. Le dossier bundle est exclu (aucun .sig ni installeur résiduel).
      - name: Cache cargo
        if: github.ref_type != 'tag'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/release/bundle
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-${{ runner.os }}-

      # Sur tag (build signé) : cache en lecture seule, clé exacte, sans restore-keys, jamais réécrit par ce build.
      - name: Cache cargo (lecture seule)
        if: github.ref_type == 'tag'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/release/bundle
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # CI-PUB (C-172) : ce job reçoit la clé de signature ; aucun script d'installation (seul fsevents, macOS, en a un) ne s'exécute ici.
      - run: npm ci --ignore-scripts

      # CI-SEC-01 : compilation et beforeBuildCommand sans clé updater ; signature du fichier produit dans l'étape suivante.
      - name: Compiler l'installeur NSIS
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::warning::Lancement manuel : installeur non signé, pas de latest.json."
          fi
          npx tauri build --ci --bundles nsis

      # Seule cette étape reçoit la clé updater ; aucun build front ou Rust dans ce processus.
      - name: Signer l'installeur NSIS
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent : un tag de version exige la signature."
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD absent : la clé de signature est chiffrée, un tag de version exige son mot de passe."
            exit 1
          fi
          VERSION=$(node scripts/release/check-version.mjs)
          EXE="src-tauri/target/release/bundle/nsis/Spartiate_${VERSION}_x64-setup.exe"
          test -f "$EXE" || { echo "::error::Installeur absent avant signature."; exit 1; }
          npx --no-install tauri signer sign --app-version "$VERSION" "$EXE"

      - name: Rassembler installeur, signature et latest.json
        id: collect
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release/check-version.mjs)
          DIR=src-tauri/target/release/bundle/nsis
          EXE="Spartiate_${VERSION}_x64-setup.exe"
          test -f "${DIR}/${EXE}" || { echo "::error::Installeur absent : ${DIR}/${EXE}"; ls -l "${DIR}" || true; exit 1; }
          rm -rf dist-release && mkdir dist-release
          cp "${DIR}/${EXE}" dist-release/
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test -f "${DIR}/${EXE}.sig" || { echo "::error::Signature .sig absente : étape de signature incomplète."; exit 1; }
            cp "${DIR}/${EXE}.sig" dist-release/
            # Notes : section de CHANGELOG.md « ## [X.Y.Z] » ou « ## X.Y.Z », script commun PC et iPhone (I-06) ; absente sur un tag = échec.
            NOTES=$(node scripts/release/release-notes.mjs "${VERSION}") || { echo "::error::Aucune section « ## ${VERSION} » dans CHANGELOG.md : publication refusée"; exit 1; }
            BASE="https://github.com/${RELEASES_REPO}/releases/download/v${VERSION}"
            node scripts/release/make-latest-json.mjs "${VERSION}" "dist-release/${EXE}" "dist-release/${EXE}.sig" "${BASE}" "${NOTES}" > dist-release/latest.json
            cat dist-release/latest.json
            # Vérification hors ligne avec la clé publique de tauri.conf.json avant toute publication.
            node scripts/release/verify-signature.mjs "dist-release/${EXE}" "dist-release/${EXE}.sig" "${VERSION}"
            echo "sha256=$(sha256sum "dist-release/${EXE}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          ls -l dist-release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Spartiate-windows
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Publication : uniquement sur push de tag vX.Y.Z. L'environnement « releases » porte le jeton de
  # publication (lui seul l'a), sans approbation manuelle (décision d'Ali du 2026-10-07, docs/decisions.md).
  publish:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: releases
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Spartiate-windows
          path: dist-release

      # L'endpoint de l'updater (tauri.conf.json, plugins.updater.endpoints) est
      # https://github.com/doncivo/spartiate-releases/releases/latest/download/latest.json :
      # latest.json est donc joint à chaque release, et la release la plus récente est marquée « latest ».
      - name: Publier sur spartiate-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          EXPECTED_SHA256: ${{ needs.windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret RELEASES_TOKEN absent : publication impossible (les fichiers restent en artefact)."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXE="dist-release/Spartiate_${VERSION}_x64-setup.exe"
          for f in "$EXE" "$EXE.sig" dist-release/latest.json; do
            test -f "$f" || { echo "::error::Fichier absent : $f"; ls -l dist-release; exit 1; }
          done
          # latest.json doit annoncer la version du tag, et l'installeur doit être celui vérifié par le job windows.
          ANNOUNCED=$(node -p "require('./dist-release/latest.json').version")
          [ "$ANNOUNCED" = "$VERSION" ] || { echo "::error::latest.json annonce ${ANNOUNCED}, le tag vaut ${VERSION}"; exit 1; }
          ACTUAL=$(sha256sum "$EXE" | cut -d' ' -f1)
          [ -n "${EXPECTED_SHA256:-}" ] && [ "$ACTUAL" = "$EXPECTED_SHA256" ] || { echo "::error::SHA-256 de l'installeur différent de celui vérifié"; exit 1; }
          NOTES=$(node -p "require('./dist-release/latest.json').notes")
          if gh release create "$TAG" "$EXE" "$EXE.sig" dist-release/latest.json \
            --repo "$RELEASES_REPO" --title "Spartiate ${VERSION}" --notes "$NOTES" --latest; then
            echo "Release ${TAG} créée."
          else
            # CI-PUB (C-172) : republication. L'installeur déjà publié est comparé (SHA-256) avant que --clobber ne le remplace ;
            # le remplacement reste permis (relance d'une publication interrompue) mais jamais sans trace dans le journal.
            mkdir -p existing
            if gh release download "$TAG" --repo "$RELEASES_REPO" --pattern "$(basename "$EXE")" --dir existing; then
              OLD=$(sha256sum "existing/$(basename "$EXE")" | cut -d' ' -f1)
              if [ "$OLD" = "$ACTUAL" ]; then
                echo "Installeur déjà publié et identique (sha256 ${ACTUAL})."
              else
                echo "::warning::--clobber remplace un installeur déjà publié : sha256 ancien ${OLD}, nouveau ${ACTUAL}."
              fi
            else
              echo "::warning::Installeur publié illisible : --clobber sans comparaison (sha256 nouveau ${ACTUAL})."
            fi
            gh release upload "$TAG" "$EXE" "$EXE.sig" dist-release/latest.json --repo "$RELEASES_REPO" --clobber
            gh release edit "$TAG" --repo "$RELEASES_REPO" --latest
          fi
