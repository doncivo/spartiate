[package]
name = "tauri-plugin-live-activity"
version = "0.1.0"
description = "Spartiate : Live Activity du compteur (SPA-007). Appelé par Rust seulement, iPhone seulement."
authors = ["Ali Cherif"]
edition = "2021"
rust-version = "1.80"
publish = false
links = "tauri-plugin-live-activity"

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
