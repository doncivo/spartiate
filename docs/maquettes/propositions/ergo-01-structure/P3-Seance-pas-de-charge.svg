<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Proposition P3 : boutons moins et plus sur la charge et les répétitions de la série en cours">
  <title>P3 — Séance : « − / + » sur la charge (pas du matériel) et les répétitions (proposition ERGO-01, à valider par Ali)</title>
  <rect width="900" height="500" fill="#0D0E11"/>
  <text x="24" y="36" fill="#C28E4C" font-size="13" font-weight="600" letter-spacing="2">P3 · CHANGER UNE CHARGE EN UN TAP</text>
  <text x="24" y="58" fill="#A39C90" font-size="13">0.19.0 : toucher le champ, effacer, taper la valeur, fermer le clavier = 2 taps et une saisie. Proposé : 1 tap par cran, sans clavier.</text>
  <g transform="translate(225 84)">
    <rect x="0" y="0" width="450" height="360" rx="18" fill="#1D2027" stroke="#C28E4C"/>
    <text x="24" y="36" fill="#C28E4C" font-size="11" letter-spacing="2">SÉRIE EN COURS · 3 SUR 3</text>
    <text x="426" y="36" fill="#A39C90" font-size="12" text-anchor="end">précédent 67,5 × 7</text>
    <text x="112" y="120" fill="#E0B577" font-size="52" font-family="Cinzel, serif" text-anchor="middle">70</text>
    <text x="160" y="120" fill="#A39C90" font-size="15">kg</text>
    <rect x="52" y="146" width="56" height="44" rx="22" fill="none" stroke="#2A2E37"/><text x="80" y="175" fill="#EDE7DC" font-size="20" text-anchor="middle">−</text>
    <rect x="120" y="146" width="56" height="44" rx="22" fill="none" stroke="#2A2E37"/><text x="148" y="175" fill="#EDE7DC" font-size="20" text-anchor="middle">+</text>
    <line x1="225" y1="80" x2="225" y2="200" stroke="#2A2E37"/>
    <text x="320" y="120" fill="#EDE7DC" font-size="52" font-family="Cinzel, serif" text-anchor="middle">8</text>
    <text x="350" y="120" fill="#A39C90" font-size="15">reps</text>
    <rect x="266" y="146" width="56" height="44" rx="22" fill="none" stroke="#2A2E37"/><text x="294" y="175" fill="#EDE7DC" font-size="20" text-anchor="middle">−</text>
    <rect x="334" y="146" width="56" height="44" rx="22" fill="none" stroke="#2A2E37"/><text x="362" y="175" fill="#EDE7DC" font-size="20" text-anchor="middle">+</text>
    <rect x="24" y="222" width="402" height="56" rx="14" fill="#B8322A"/>
    <text x="225" y="257" fill="#EDE7DC" font-size="17" font-weight="600" text-anchor="middle">Valider la série</text>
    <text x="24" y="314" fill="#A39C90" font-size="12">À trancher : cran de la charge = plus petit incrément du profil de matériel</text>
    <text x="24" y="332" fill="#A39C90" font-size="12">(§ 14.3 ; 2,5 kg barre, paire d'haltères suivante) ; champ toujours éditable.</text>
  </g>
</svg>
