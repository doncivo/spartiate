    <text x="36" y="78" fill="#EDE7DC" font-size="15">yaourt grec|</text>
    <text x="20" y="128" fill="#EDE7DC" font-size="14">Yaourt grec nature 0 %</text><text x="380" y="128" fill="#A39C90" font-size="12" text-anchor="end">Ciqual · 59 kcal</text>
    <text x="20" y="158" fill="#EDE7DC" font-size="14">Yaourt grec 10 %</text><text x="380" y="158" fill="#A39C90" font-size="12" text-anchor="end">OFF · 133 kcal</text>
    <text x="20" y="220" fill="#EDE7DC" font-size="22" font-family="Cinzel, serif">3 taps</text>
