<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Proposition P2 : ajouter un repas depuis Aujourd'hui, recherche ouverte">
  <title>P2 — Ajouter un repas : la carte Nutrition ouvre la recherche directement (proposition structurelle ERGO-01, à valider par Ali)</title>
  <rect width="900" height="520" fill="#0D0E11"/>
  <text x="24" y="36" fill="#C28E4C" font-size="13" font-weight="600" letter-spacing="2">P2 · AJOUTER UN REPAS · UN ÉCRAN DE MOINS</text>
  <text x="24" y="58" fill="#A39C90" font-size="13">Aujourd'hui (0.19.0) : Ouvrir le journal → Rechercher un aliment → aliment → Ajouter = 4 taps. Proposé : 3 (route « journal + recherche »).</text>
  <g transform="translate(24 84)">
    <rect x="0" y="0" width="400" height="380" rx="14" fill="#15171C" stroke="#2A2E37"/>
    <text x="20" y="32" fill="#C28E4C" font-size="11" letter-spacing="2">NUTRITION</text>
    <text x="20" y="76" fill="#E0B577" font-size="36" font-family="Cinzel, serif">1 190</text>
    <text x="150" y="76" fill="#A39C90" font-size="14">kcal restantes</text>
    <rect x="20" y="104" width="172" height="48" rx="24" fill="#B8322A"/>
    <text x="106" y="134" fill="#EDE7DC" font-size="15" font-weight="600" text-anchor="middle">Ajouter un repas</text>
    <rect x="208" y="104" width="172" height="48" rx="24" fill="none" stroke="#2A2E37"/>
    <text x="294" y="134" fill="#EDE7DC" font-size="15" font-weight="600" text-anchor="middle">Journal</text>
    <text x="20" y="200" fill="#A39C90" font-size="12">« Ajouter un repas » ouvre le Journal avec la recherche</text>
    <text x="20" y="218" fill="#A39C90" font-size="12">déjà ouverte et le champ actif (nouveau paramètre de route).</text>
  </g>
  <g transform="translate(470 84)">
    <rect x="0" y="0" width="400" height="380" rx="14" fill="#15171C" stroke="#2A2E37"/>
