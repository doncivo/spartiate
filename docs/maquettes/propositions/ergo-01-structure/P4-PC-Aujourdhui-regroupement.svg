<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Proposition P4 : regrouper Profil, iPhone et Données du PC dans une seule carte d'état">
  <title>P4 — PC Aujourd'hui : colonne de droite regroupée en une carte « État » ; Récupération en tête de la colonne principale (proposition ERGO-01, à valider par Ali)</title>
  <rect width="1000" height="560" fill="#0D0E11"/>
  <text x="24" y="36" fill="#C28E4C" font-size="13" font-weight="600" letter-spacing="2">P4 · PC 1 440 PX · AUJOURD'HUI · MOINS DE CARTES</text>
  <text x="24" y="58" fill="#A39C90" font-size="13">0.19.0 : 4 cartes à gauche + 3 cartes « Profil / iPhone / Données » à droite. Proposé : Récupération en tête, une seule carte « État » à droite.</text>
  <g transform="translate(24 84)">
    <rect x="0" y="0" width="600" height="150" rx="14" fill="#15171C" stroke="#2A2E37"/>
    <circle cx="80" cy="75" r="52" fill="none" stroke="#1D2027" stroke-width="10"/>
    <path d="M80 23 A52 52 0 1 1 30 92" fill="none" stroke="#5E9E6B" stroke-width="10" stroke-linecap="round"/>
    <text x="80" y="88" fill="#E0B577" font-size="34" font-family="Cinzel, serif" text-anchor="middle">72</text>
    <text x="160" y="56" fill="#C28E4C" font-size="11" letter-spacing="2">RÉCUPÉRATION</text>
    <text x="160" y="80" fill="#EDE7DC" font-size="15">Bonne · zone cible 6–8</text>
    <text x="160" y="108" fill="#A39C90" font-size="13">Sommeil 7 h 12 / 7 h 45 · Effort hier 6,4</text>
    <rect x="0" y="166" width="600" height="150" rx="14" fill="#15171C" stroke="#2A2E37"/>
    <text x="20" y="196" fill="#C28E4C" font-size="11" letter-spacing="2">SÉANCE DU JOUR</text>
    <text x="20" y="232" fill="#EDE7DC" font-size="26" font-family="Cinzel, serif">Haut A</text>
    <rect x="400" y="206" width="180" height="48" rx="12" fill="#B8322A"/><text x="490" y="236" fill="#EDE7DC" font-size="15" font-weight="600" text-anchor="middle">Lancer (Ctrl+Entrée)</text>
    <text x="20" y="362" fill="#C28E4C" font-size="11" letter-spacing="2">NUTRITION</text>
    <text x="20" y="400" fill="#E0B577" font-size="34" font-family="Cinzel, serif">1 190</text><text x="130" y="400" fill="#A39C90" font-size="14">kcal restantes</text>
  </g>
  <g transform="translate(660 84)">
    <rect x="0" y="0" width="316" height="300" rx="14" fill="#15171C" stroke="#2A2E37"/>
    <text x="20" y="30" fill="#C28E4C" font-size="11" letter-spacing="2">ÉTAT</text>
    <text x="20" y="64" fill="#A39C90" font-size="13">Synchro</text><text x="296" y="64" fill="#EDE7DC" font-size="13" text-anchor="end">il y a 2 min</text>
    <text x="20" y="94" fill="#A39C90" font-size="13">Signature iPhone</text><text x="296" y="94" fill="#EDE7DC" font-size="13" text-anchor="end">5 j</text>
    <text x="20" y="124" fill="#A39C90" font-size="13">Sauvegarde</text><text x="296" y="124" fill="#EDE7DC" font-size="13" text-anchor="end">aujourd'hui 10:00</text>
    <text x="20" y="154" fill="#A39C90" font-size="13">Poids</text><text x="296" y="154" fill="#EDE7DC" font-size="13" text-anchor="end">81,4 kg</text>
    <text x="20" y="200" fill="#A39C90" font-size="12">Profil (taille, naissance, objectif) : déplacé</text>
    <text x="20" y="218" fill="#A39C90" font-size="12">dans Plus › Profil et poids, où il se règle.</text>
  </g>
