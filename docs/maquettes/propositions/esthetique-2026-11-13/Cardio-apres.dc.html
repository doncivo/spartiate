<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cardio GPS en cours — après</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;display=swap">
<style>
body{margin:0}
.c{font-family:Cinzel,"Times New Roman",serif;font-weight:600}
.sec{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#C28E4C}
</style>
</helmet>
<div style="width:440px;height:956px;background:#0D0E11;color:#EDE7DC;font-family:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums;overflow:hidden;padding:60px 24px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="sec">Course · GPS actif</span><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5E9E6B"><i style="width:8px;height:8px;border-radius:4px;background:#5E9E6B"></i>signal bon</span></div>

<div style="text-align:center">
<div style="display:flex;align-items:baseline;justify-content:center;gap:8px"><span class="c" style="font-size:72px;line-height:1;color:#E0B577">5,24</span><span style="color:#A39C90;font-size:18px">km</span></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;border-top:1px solid #2A2E37;border-bottom:1px solid #2A2E37">
<div style="padding:14px 0;border-right:1px solid #2A2E37"><div class="c" style="font-size:24px">28:41</div><div style="font-size:12px;color:#A39C90">durée</div></div>
<div style="padding:14px 0;border-right:1px solid #2A2E37"><div class="c" style="font-size:24px">5'29"</div><div style="font-size:12px;color:#A39C90">allure / km</div></div>
<div style="padding:14px 0"><div class="c" style="font-size:24px">5'12"</div><div style="font-size:12px;color:#A39C90">dernier km</div></div>
</div>

<div style="height:300px;border-radius:16px;background:#15171C;position:relative;overflow:hidden">
<svg width="392" height="300" viewBox="0 0 392 300" role="img" aria-label="Tracé du parcours, schématique"><g stroke="#1D2027" stroke-width="1"><line x1="0" y1="75" x2="392" y2="75"></line><line x1="0" y1="150" x2="392" y2="150"></line><line x1="0" y1="225" x2="392" y2="225"></line><line x1="98" y1="0" x2="98" y2="300"></line><line x1="196" y1="0" x2="196" y2="300"></line><line x1="294" y1="0" x2="294" y2="300"></line></g><path d="M60 250 C80 200 70 160 120 140 S200 150 230 110 S300 60 330 90 S320 190 270 210 S170 230 140 250" stroke="#C28E4C" stroke-width="4" fill="none" stroke-linecap="round"></path><circle cx="60" cy="250" r="6" fill="#A39C90"></circle><circle cx="140" cy="250" r="8" fill="#E0B577" stroke="#0D0E11" stroke-width="3"></circle></svg>
<span style="position:absolute;left:12px;bottom:10px;font-size:11px;color:#A39C90">Tracé gardé sur cet iPhone · seules distance et durée sont synchronisées</span>
</div>

<div style="margin-top:auto;margin-bottom:44px;display:flex;gap:10px">
<button type="button" style="flex:1;height:56px;border-radius:14px;border:1px solid #2A2E37;background:transparent;color:#EDE7DC;font-weight:600">Pause</button>
<button type="button" style="flex:1;height:56px;border-radius:14px;border:0;background:#B8322A;color:#EDE7DC;font-weight:600;font-size:16px">Terminer</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
